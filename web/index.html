<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0B10">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RH—MUSIC">
<meta name="description" content="RH—MUSIC — поиск и воспроизведение музыки из каталога Zvuk.">
<title>RH—MUSIC</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%236C8CFF'/><text x='32' y='43' font-family='system-ui' font-size='26' font-weight='800' fill='white' text-anchor='middle'>RH</text></svg>">
</head>
<body>

<div class="app">
  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#" data-action="home">
        <span class="brand-logo">RH</span>
        <span class="brand-text">
          <span class="brand-title">RH<span class="brand-dash">—</span>MUSIC</span>
          <span class="brand-sub" id="brandSub">каталог Zvuk</span>
        </span>
      </a>

      <form class="searchbar" id="searchForm" autocomplete="off">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10.5 3a7.5 7.5 0 1 1-4.6 13.4l-3.2 3.2a1 1 0 1 1-1.4-1.4l3.2-3.2A7.5 7.5 0 0 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/>
        </svg>
        <input id="q" type="search" name="q" placeholder="Трек, исполнитель или альбом"
               enterkeyhint="search" autocapitalize="off" autocorrect="off" spellcheck="false"
               aria-label="Поиск музыки">
        <button class="search-btn" type="submit" aria-label="Найти">Найти</button>
      </form>

      <nav class="tabs" id="tabs" aria-label="Тип поиска">
        <button class="tab is-active" data-type="all" type="button">Всё</button>
        <button class="tab" data-type="tracks" type="button">Треки</button>
        <button class="tab" data-type="artists" type="button">Исполнители</button>
        <button class="tab" data-type="albums" type="button">Альбомы</button>
      </nav>
    </div>
  </header>

  <main class="main" id="main" tabindex="-1"></main>
</div>

<footer class="player" id="player" aria-label="Плеер">
  <div class="player-glow"></div>

  <div class="seek-wrap">
    <input id="seek" class="seek" type="range" min="0" max="1000" value="0" step="1"
           aria-label="Позиция воспроизведения" disabled>
  </div>

  <div class="player-inner">
    <div class="now-playing">
      <div class="np-cover" id="npCoverWrap">
        <img id="npCover" alt="" decoding="async">
        <span class="np-cover-fallback">RH</span>
      </div>
      <div class="np-meta">
        <div class="np-title" id="npTitle">Ничего не играет</div>
        <div class="np-artist" id="npArtist">Выберите трек в результатах</div>
      </div>
    </div>

    <div class="times">
      <span id="tCur">0:00</span>
      <span class="times-sep">/</span>
      <span id="tDur">0:00</span>
    </div>

    <div class="controls">
      <button class="ctrl" id="prev" type="button" aria-label="Предыдущий трек" disabled>
        <svg viewBox="0 0 24 24"><path d="M6 5a1 1 0 0 1 2 0v5.2l8.4-5.6A1.2 1.2 0 0 1 18 5.6v12.8a1.2 1.2 0 0 1-1.6 1L8 13.8V19a1 1 0 1 1-2 0V5Z"/></svg>
      </button>
      <button class="ctrl play" id="play" type="button" aria-label="Воспроизвести" disabled>
        <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5.2c0-1 1.1-1.6 2-1.1l9.4 6.3a1.3 1.3 0 0 1 0 2.2L10 19c-.9.5-2-.1-2-1.1V5.2Z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24"><path d="M7 5a1.5 1.5 0 0 1 3 0v14a1.5 1.5 0 0 1-3 0V5Zm7 0a1.5 1.5 0 0 1 3 0v14a1.5 1.5 0 0 1-3 0V5Z"/></svg>
        <span class="spinner" aria-hidden="true"></span>
      </button>
      <button class="ctrl" id="next" type="button" aria-label="Следующий трек" disabled>
        <svg viewBox="0 0 24 24"><path d="M18 5a1 1 0 0 0-2 0v5.2L7.6 4.6A1.2 1.2 0 0 0 6 5.6v12.8a1.2 1.2 0 0 0 1.6 1L16 13.8V19a1 1 0 1 0 2 0V5Z"/></svg>
      </button>
    </div>

    <button class="quality" id="quality" type="button" aria-label="Качество звука">MID<span>128</span></button>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<audio id="audio" preload="metadata" playsinline></audio>

<script src="app.js"></script>
</body>
</html>
